<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <title>MPT MRT Daily</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="print.css">
</head>
<body>
  <div id="app">
    <header class="topbar">
      <img class="logo" src="assets/mpt-logo-white.png" alt="MPT">
      <div class="outlet">
        <div class="outlet-name" id="outletName">MRT</div>
        <div class="outlet-sub" id="todayText"></div>
      </div>
      <div class="topbar-right">
        <span id="saveStatus" class="save-status">✔ Saved</span>
        <button id="langToggle" class="lang-btn" title="Language / 语言"></button>
        <div class="textsize">
          <span data-i18n="Text size">Text size</span>
          <button id="textSmaller" data-i18n-title="Smaller text" title="Smaller text">A−</button>
          <button id="textBigger" data-i18n-title="Bigger text" title="Bigger text">A+</button>
        </div>
      </div>
    </header>
    <nav class="tabs" id="tabs">
      <button data-page="stock" data-i18n="Stock Balance">Stock Balance</button>
      <button data-page="battery" data-i18n="Battery">Battery</button>
      <button data-page="strap" data-i18n="Strap">Strap</button>
      <button data-page="bankin" data-i18n="Bank In">Bank In</button>
      <button data-page="month" data-i18n="Month Sale">Month Sale</button>
      <button data-page="settings" data-i18n="Settings">Settings</button>
    </nav>
    <main id="page"></main>
  </div>

  <div id="preview" hidden>
    <div class="preview-bar">
      <button class="btn big" id="previewBack" data-i18n="◀ Back">◀ Back</button>
      <div class="preview-title" id="previewTitle">Print Preview</div>
      <div class="preview-options" id="previewOptions"></div>
      <button class="btn big" id="previewPdf" data-i18n="Save as PDF">Save as PDF</button>
      <button class="btn big green" id="previewPrint" data-i18n="PRINT">PRINT</button>
    </div>
    <div class="preview-scroll"><div id="printArea"></div></div>
  </div>

  <div id="modal" hidden>
    <div class="modal-box">
      <h2 id="modalTitle"></h2>
      <div id="modalBody"></div>
      <div class="modal-buttons" id="modalButtons"></div>
    </div>
  </div>
  <div id="toast" hidden></div>

  <script src="i18n.js"></script>
  <script src="zh.js"></script>
  <script src="calc.js"></script>
  <script src="app.js"></script>
  <script src="print.js"></script>
  <script src="pages/stock.js"></script>
  <script src="pages/items.js"></script>
  <script src="pages/bankin.js"></script>
  <script src="pages/month.js"></script>
  <script src="pages/settings.js"></script>
  <script src="main-ui.js"></script>
</body>
</html>
